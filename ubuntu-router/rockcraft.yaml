name: ubuntu-router
base: ubuntu@24.04
version: '0.1'
summary: A Linux router.
description: |
    This container image is used to operate Linux iptables routers.
license: Apache-2.0
platforms:
  amd64:
  arm64:

parts:
  ip-tools:
    plugin: nil
    stage-packages:
      - iptables
      - iproute2
      - iputils-ping
      - tcpdump
      - ethtool

  responder:
    plugin: dump
    source: files/responder.py
    source-type: file
    stage-packages:
      - python3

  # tcpdump drops privileges to the "tcpdump" user by default; the rock stages
  # the package without running its postinst, so create the user/group here.
  # base-passwd_data seeds /etc/passwd and /etc/group so useradd/groupadd --root
  # can modify them in the rock filesystem.
  tcpdump-user:
    plugin: nil
    stage-packages:
      - base-passwd_data
    override-build: |
      craftctl default
      groupadd --root "${CRAFT_PART_INSTALL}" --system tcpdump
      useradd --root "${CRAFT_PART_INSTALL}" --system --gid tcpdump \
        --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin tcpdump
